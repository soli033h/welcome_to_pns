services:
  dev:
    image: welcome-to-pns-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
    - "127.0.0.1:4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
